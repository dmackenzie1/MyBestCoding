[project]
name = "chattercatcher-tooling"
version = "0.4.4"
description = "Shared tooling configuration for the ChatterCatcher Transcribe workspace."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.41.1",
    "awscli>=1.43.0",
    "pre-commit>=4.3.0",
    "ruff",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "services",
    "services/common",
    "services/common/shared_code",
    "services/web",
    "services/web/app",
    "services/transcribe",
    "services/capture",
]
testpaths = ["services"]
